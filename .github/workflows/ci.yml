name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR/branch supersedes the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'
  HUSKY: '0'

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm --filter backend lint:check
      - name: Lint frontend
        run: pnpm --filter frontend lint:check

      - name: Type-check backend
        run: pnpm --filter backend type-check
      - name: Type-check frontend
        run: pnpm --filter frontend type-check
      - name: Type-check env-config
        run: pnpm --filter @la-fete/env-config type-check

  unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend test --ci

  e2e:
    name: Backend e2e (orders, payments, delivery)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lafete_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lafete_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lafete_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Razorpay, Borzo and SMTP are stubbed inside the suite — no secrets needed.
      - run: pnpm --filter backend test:e2e --ci

  build:
    name: Build backend & frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build backend
        run: pnpm --filter backend build
      - name: Build frontend
        # next.config.ts refuses to build production without a non-loopback
        # API_URL; nothing is fetched from it at build time.
        env:
          API_URL: https://api.ci.invalid
        run: pnpm --filter frontend build

  migrations:
    name: Migrations replay on empty DB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # KNOWN BROKEN: the migration history can't be replayed from scratch
    # (AddCakeFields drops order_items.sweetener, which no earlier migration
    # creates). Non-blocking until the chain is repaired — then delete this
    # line and add the job to `ci-ok` below.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lafete_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lafete_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lafete_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend migration:run

  # Single stable check to mark as "required" in branch protection, so adding
  # or renaming jobs above never needs a settings change.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, unit, e2e, build]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All required checks passed."
